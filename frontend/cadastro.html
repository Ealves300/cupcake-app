<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Doce Encanto - Cadastro</title>
<meta name="description" content="Crie sua conta na Doce Encanto e acompanhe seus pedidos.">

<link rel="icon" href="imagens/icon2.png" type="image/png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/cadastro.css">
</head>

<body>
<!-- gota de chocolate (apenas desktop) -->
  <svg class="choco-drip" viewBox="0 0 260 90" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,0 H260 V20 C240,20 235,55 220,55 C205,55 205,25 190,25 C175,25 175,45 160,45 C145,45 145,15 130,15 C115,15 115,65 100,65 C85,65 85,20 70,20 C55,20 55,40 40,40 C25,40 25,10 0,10 Z" fill="#5b3327"/>
  </svg>

  <div class="auth-card">

    <!-- PAINEL DA MARCA (some no mobile) -->
      <div class="brand-panel">
        <div class="brand-blob-top"></div>
        <div class="brand-blob-bottom"></div>

        <img src="imagens/icon.png" alt=" Logo Doce encanto" class="cupcake-icon">

        <h1 class="brand-title">Doce Encanto</h1>
        
        <div class="divider-line">
          <span></span><span class="heart-mini">&#9829;</span><span></span>
        </div>
        <div class="brand-sub">Confeitaria artesanal</div>
      </div>

      <!-- PAINEL DO FORMULARIO -->
      <div class="form-panel">
          <img src="imagens/icon.png" alt="Logo Doce encanto" class="cupcake-icon-small">
          <h2 class="welcome-title">Crie sua conta</h2>
          <div class="welcome-sub">Preencha os dados abaixo para se cadastrar</div>
          <div class="divider-line form-divider">
          <span></span><span class="heart-mini">&#9829;</span><span></span>
      </div>

      <form id="signupForm" novalidate>
          <div class="field">
            <span class="icon-left" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </span>
            <input
              type="text"
              id="nome"
              name="nome"
              placeholder="Nome completo"
              autocomplete="name"
              required
            >
          </div>
          
          <p class="field-msg" id="msg-nome"></p>
    
          <div class="field">
            <span class="icon-left" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2"/><path d="M3 7l9 6 9-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </span>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="E-mail"
              autocomplete="email"
              required
            >
          </div>
          <p class="field-msg" id="msg-email"></p>
    
          <div class="field">
            <span class="icon-left" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="2"/></svg>
            </span>
            <input
              type="password"
              id="senha"
              name="senha"
              placeholder="Senha"
              autocomplete="new-password"
              required
            >
            <button 
            type="button" 
            class="icon-right" 
            data-target="senha" 
            aria-label="Mostrar senha"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7Z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/></svg>
            </button>
          </div>

          <p class="field-msg" id="msg-senha"></p>
    
          <div class="field">
            <span class="icon-left" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="2"/></svg>
            </span>
            <input
              type="password"
              id="confirmarSenha"
              name="confirmarSenha"
              placeholder="Confirmar senha"
              autocomplete="new-password"
              required
            >
            <button
              type="button"
              class="icon-right"
              data-target="senha"
              aria-label="Mostrar senha"
              aria-pressed="false"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7Z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/></svg>
            </button>
          </div>
          <p class="field-msg" id="msg-confirmarSenha"></p>
    
          <label class="terms">
            <input 
            type="checkbox" 
            id="termos" 
            name="termos" 
            required
            >

            <span>
              Li e aceito os
              <a href="termos.html">Termos de Uso</a>
              e a
              <a href="privacidade.html">Política de Privacidade</a>.
            </span>

          </label>

          <p class="field-msg" id="msg-termos">

          </p>
          <p class="field-msg" id="msg-servidor">

          </p>
    
          <button type="submit" class="btn-submit" id="btnSubmit">
            Criar conta →
          </button>

          
      </form>  <!-- nao sei de onde que fecha isso -->

      <div class="or-divider">
        ou
      </div>

      <p class="login-link">
        Já tem uma conta? <a href="login.html">Entrar →</a>
      </p>

  </div>

  <div class="success-overlay" id="successOverlay">
    <div class="success-card">
      <div class="emoji">🧁💕</div>
      <h2>Conta criada!</h2>
      <p id="successText">Sua conta foi criada com sucesso.</p>
      <button id="closeSuccess">Ir para o login</button>
    </div>
  </div>

<script src="js/cadastro.js"></script>
</body>
</html>
